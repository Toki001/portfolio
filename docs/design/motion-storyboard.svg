ilto · truthful copy feedback</text><text x="32" y="373" font-size="18">Desktop: bounded depth + pointer response. Touch / reduced motion / no JS: readable ordered content and direct controls.</text><text x="32" y="402" font-size="14" fill="#767B91">No forced loader · no wheel interception · no third-party public media · no new animation dependency</text></g></svg>
