<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script>
      document.documentElement.dataset.motion = matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches
        ? "reduced"
        : "full";
    </script>
    <!-- seo-head -->
    <meta name="theme-color" content="#FFFFFF" />
    <!-- One stable raster favicon for browsers and Google's search crawler. -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/toki-icon-192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/toki-apple-touch-icon.png"
    />
    <link rel="mask-icon" href="/toki-mask.svg" color="#890620" />
    <meta name="apple-mobile-web-app-title" content="toki." />
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="manifest" href="/site.webmanifest?v=toki-symbol-20261027" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
